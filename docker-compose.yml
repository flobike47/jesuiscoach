services:
  # Postgres de dev (5433 côté hôte : ne gêne pas un Postgres local sur 5432)
  postgres:
    image: postgres:16-alpine
    container_name: jesuiscoach-postgres
    environment:
      POSTGRES_DB: jesuiscoach
      POSTGRES_USER: jesuiscoach
      POSTGRES_PASSWORD: jesuiscoach
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jesuiscoach -d jesuiscoach"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: jesuiscoach-redis
    ports:
      # 6380 côté hôte : ne gêne pas le Redis de dev d'investhelper (6379)
      - "6380:6379"
    volumes:
      - redis-data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
